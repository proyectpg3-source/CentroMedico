name: centro-medico-microservicios

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Centro_medico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - centro_medico_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Centro_medico"] 
      interval: 5s
      timeout: 5s
      retries: 10

  triage-priority-service:
    build:
      context: ./microservices/triage-priority-service
    environment:
      NODE_ENV: production
      PORT: 4101
    ports:
      - "4101:4101"

  inventory-alerts-service:
    build:
      context: ./microservices/inventory-alerts-service
    environment:
      NODE_ENV: production
      PORT: 4102
    ports:
      - "4102:4102"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      triage-priority-service:
        condition: service_started
      inventory-alerts-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: Centro_medico
      DB_PASSWORD: postgres
      DB_PORT: 5432
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: cambia-esta-clave-en-produccion
      JWT_EXPIRES_IN: 8h
      TRIAGE_SERVICE_URL: http://triage-priority-service:4101
      INVENTORY_ALERTS_SERVICE_URL: http://inventory-alerts-service:4102
      MICROSERVICE_TIMEOUT_MS: 1500
      INVENTORY_EXPIRING_SOON_DAYS: 180
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  centro_medico_pgdata:
