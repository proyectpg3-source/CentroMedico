  <line x1="70" y1="143" x2="380" y2="143" stroke="#000000" stroke-width="1.8"/>
  <text x="84" y="130" class="object-title">paciente01 : Paciente</text>
  <text x="84" y="167" class="object-attr">idPaciente = 001</text>
  <text x="84" y="191" class="object-attr">nombre = Paciente registrado</text>
  <text x="84" y="215" class="object-attr">estado = Activo</text>
</g>
<g id="Atencion">
