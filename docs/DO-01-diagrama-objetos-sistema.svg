<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="920" viewBox="0 0 1740 920">
  <rect width="1740" height="920" fill="#ffffff"/>
  <style>
    .title {
      font: 700 30px Arial, Helvetica, sans-serif;
      fill: #000000;
    }
    .object-title {
      font: 700 16px Arial, Helvetica, sans-serif;
      fill: #000000;
      text-decoration: underline;
    }
    .object-attr {
      font: 14px Consolas, "Courier New", monospace;
      fill: #000000;
    }
    .link-label {
      font: 700 13px Arial, Helvetica, sans-serif;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }
  </style>

  <text x="70" y="50" class="title">DO-01 - Diagrama de objetos del sistema</text>

  <g class="link">
  <line x1="225" y1="172.5" x2="640" y2="182.5" stroke="#000000" stroke-width="2"/>
</g>
<g class="link">
  <line x1="640" y1="182.5" x2="1105" y2="182.5" stroke="#000000" stroke-width="2"/>
</g>
<g class="link">
  <line x1="1105" y1="182.5" x2="1045" y2="467.5" stroke="#000000" stroke-width="2"/>
</g>
<g class="link">
  <line x1="1045" y1="467.5" x2="1525" y2="457.5" stroke="#000000" stroke-width="2"/>
</g>
<g class="link">
  <line x1="225" y1="172.5" x2="235" y2="747.5" stroke="#000000" stroke-width="2"/>
</g>
<g class="link">
